[loggers]
keys=root,fastapi_app

[handlers]
keys=fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=fileHandler

[logger_fastapi_app]
level=INFO
handlers=fileHandler
qualname=fastapi_app
progate=0

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=simpleFormatter
args=('app_errors.log','a',5000000,3)

[formatter_simpleFormatter]
format=%(asctime)s - %(levelname)s - %(message)s